  <meta charset="utf-8" />

</head>
<body>
  <!-- 🎵 Background Music -->
  <audio id="bgMusic" loop preload="auto">
    <source src="audio/song0.mpeg" type="audio/mpeg">

  <main class="container">
    <!-- 🎉 Header Section -->
    <header class="top" id="hbHeader">
  <style>
    #hbHeader {
      text-align: center;
      margin-bottom: 10px;
      background: linear-gradient(90deg, rgba(255,255,255,0.45), rgba(255,255,255,0.15));
      padding: 22px 16px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      overflow: hidden;
      position: relative;
    }

    #hbHeader .hb-title {
      margin: 0;
      font-size: clamp(22px, 5vw, 36px);
      letter-spacing: 0.5px;
      font-weight: 800;
      background: linear-gradient(90deg, #ff4d8d, #c44dff, #ff4d8d);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: hb-shine 3s ease-in-out infinite, hb-pop 0.9s cubic-bezier(0.2, 0.9, 0.2, 1) both;
    }

    #hbHeader .hb-sub {
      margin: 10px 0 0;
      color: #6b6b6b;
      font-size: 0.95rem;
      opacity: 0;
      animation: hb-fade 0.8s ease 0.45s forwards;
    }

    #hbHeader .hb-spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff9fb6;
      box-shadow: 0 0 8px rgba(255, 159, 182, 0.7);
      pointer-events: none;
      opacity: 0;
    }

    @keyframes hb-shine {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }

    @keyframes hb-pop {
      0% { opacity: 0; transform: scale(0.85) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes hb-fade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes hb-spark-fly {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0.2); }
    }

    @media (max-width: 640px) {
      #hbHeader { padding: 16px 12px; }
      #hbHeader .hb-title { font-size: clamp(20px, 6vw, 28px); }
      #hbHeader .hb-sub { font-size: 0.85rem; }
    }
  </style>

  <h1 class="hb-title">🎉 Happy Birthday Soumi 🎉</h1>
  <p class="hb-sub">Make a wish · Blow the candles · Cut the cake</p>

  <script>
    (function () {
      const header = document.getElementById("hbHeader");
      if (!header) return;

      // Soft sparkle burst on the whole header box — every 2 seconds
function burst() {
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span");
    s.className = "hb-spark";

    // Random position across the whole header box
    s.style.left = 8 + Math.random() * 84 + "%";
    s.style.top = 10 + Math.random() * 70 + "%";

    const angle = Math.random() * Math.PI * 2;
    const dist = 18 + Math.random() * 40;
    s.style.setProperty("--sx", Math.cos(angle) * dist + "px");
    s.style.setProperty("--sy", Math.sin(angle) * dist + "px");
    s.style.animation = "hb-spark-fly 1s ease-out forwards";
    s.style.animationDelay = Math.random() * 0.15 + "s";

    header.appendChild(s);
    setTimeout(() => s.remove(), 1100);
  }
}

// First burst, then every 2 seconds
burst();
setInterval(burst, 2000);

      setTimeout(burst, 500);
    })();
  </script>
</header>

    <!-- 🎈 Floating Message -->
<div id="message" class="floating-message">
  <style>
    #message.floating-message {
      position: fixed;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%) scale(0.75);
      background: linear-gradient(90deg, #fff 0%, #ffe8f0 45%, #fff 100%);
      padding: 18px 36px;
      border-radius: 18px;
      font-weight: 800;
      font-size: clamp(18px, 5vw, 28px);
      color: #c45a8a;
      opacity: 0;
      pointer-events: none;
      text-align: center;
      line-height: 1.35;
      white-space: nowrap;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.14);
      z-index: 9999;
      transition: opacity 0.85s cubic-bezier(0.2, 0.9, 0.2, 1),
                  transform 0.85s cubic-bezier(0.2, 0.9, 0.2, 1);
      will-change: transform, opacity;
      letter-spacing: 0.3px;
    }

    #message.floating-message.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      animation: msg-pulse 1.6s ease-in-out 0.9s infinite;
    }

    #message .msg-text {
      display: inline-block;
      background: linear-gradient(90deg, #ff4d8d, #c44dff, #ff4d8d);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: msg-shine 2.8s ease-in-out infinite;
    }

    #message .msg-spark {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff9fb6;
      box-shadow: 0 0 10px rgba(255, 159, 182, 0.85);
      pointer-events: none;
      opacity: 0;
    }

    @keyframes msg-shine {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }

    @keyframes msg-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.04); }
    }

    @keyframes msg-spark-fly {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--mx), var(--my)) scale(0.2); }
    }

    @media (max-width: 640px) {
      #message.floating-message {
        font-size: 17px;
        padding: 14px 20px;
        max-width: 90%;
        white-space: normal;
      }
    }
  </style>

  <span class="msg-text">🎈 Happy Birthday, Dear Soumi 🎈</span>

  <script>
    (function () {
      const msg = document.getElementById("message");
      if (!msg) return;

      // When .show is added (by your cake cut script), burst sparkles
      const observer = new MutationObserver(() => {
        if (!msg.classList.contains("show")) return;

        for (let i = 0; i < 16; i++) {
          const s = document.createElement("span");
          s.className = "msg-spark";
          const angle = (Math.PI * 2 * i) / 16;
          const dist = 40 + Math.random() * 60;
          s.style.left = "50%";
          s.style.top = "50%";
          s.style.setProperty("--mx", Math.cos(angle) * dist + "px");
          s.style.setProperty("--my", Math.sin(angle) * dist + "px");
          s.style.animation = "msg-spark-fly 1.1s ease-out forwards";
          s.style.animationDelay = Math.random() * 0.2 + "s";
          msg.appendChild(s);
          setTimeout(() => s.remove(), 1300);
        }
      });

      observer.observe(msg, { attributes: true, attributeFilter: ["class"] });
    })();
  </script>
</div>
  </main>

<script>
  // 🛡️ Guard Protection Script
  const unlockDate = new Date("2026-09-15T00:00:00+05:30");
  const now = new Date();
  if (now < unlockDate) {
    // ⛔ সময় এখনো হয়নি — ফেরত পাঠাও countdown page (index.html) এ
    window.location.href = "index.html";
  }

  // ---------------------------
  // COUNTDOWN TIMER
  // ---------------------------
  const targetDate = new Date("2026-09-15T00:00:00+05:30");
  const daysEl = document.getElementById("days");
  const hoursEl = document.getElementById("hours");
  const minsEl = document.getElementById("minutes");
  const secsEl = document.getElementById("seconds");

  function updateCountdown() {
    const now = new Date();
    const diff = targetDate - now;
    if (diff <= 0) return;
    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);
    if (daysEl) daysEl.textContent = d;
    if (hoursEl) hoursEl.textContent = h.toString().padStart(2, "0");
    if (minsEl) minsEl.textContent = m.toString().padStart(2, "0");
    if (secsEl) secsEl.textContent = s.toString().padStart(2, "0");
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  // ---------------------------
  // CANDLES & CUT ANIMATION
  // ---------------------------
  const candles = document.querySelectorAll(".candle");
  const knife = document.getElementById("knife");
  const msg = document.getElementById("message");
  const nextBtn = document.getElementById("nextBtn");
  const cake = document.querySelector(".cake-css");

  let blown = 0;
  let hasCut = false;

  // Soft smoke puff when a candle is blown out
  function spawnSmoke(candle) {
    const smoke = document.createElement("span");
    smoke.className = "candle-smoke";
    candle.appendChild(smoke);
    setTimeout(() => smoke.remove(), 900);
  }

  candles.forEach(c => {
    c.addEventListener("click", () => {
      if (c.classList.contains("extinguished") || hasCut) return;

      c.classList.add("extinguished");
      c.classList.add("blow-pop"); // tiny scale feedback
      spawnSmoke(c);
      blown++;

      setTimeout(() => c.classList.remove("blow-pop"), 280);

      if (blown === candles.length) {
        // All candles off — show knife with soft entrance
        setTimeout(() => {
          if (!knife) return;
          knife.style.display = "block";
          knife.classList.add("knife-in");
          knife.style.opacity = "1";
        }, 450);
      }
    });
  });

  // Knife drag & cut
  let dragging = false;

  if (knife) {
    knife.addEventListener("pointerdown", e => {
      if (hasCut) return;
      dragging = true;
      knife.classList.add("dragging");
      knife.setPointerCapture?.(e.pointerId);
    });
  }

  window.addEventListener("pointermove", e => {
    if (!dragging || hasCut || !knife || !cake) return;
    const rect = cake.getBoundingClientRect();
    knife.style.left = e.clientX - rect.left - 24 + "px";
    knife.style.top = e.clientY - rect.top - 24 + "px";
  });

  window.addEventListener("pointerup", () => {
    if (!dragging || hasCut) return;
    dragging = false;
    hasCut = true;

    if (knife) knife.classList.remove("dragging");
    if (cake) {
      cake.classList.add("cut");
      cake.classList.add("cake-shake"); // soft settle after cut
    }

    if (knife) {
      knife.style.transition = "opacity 0.8s ease";
      knife.style.opacity = "0";
    }

    // Message + confetti-like sparkles
    setTimeout(() => {
      if (msg) msg.classList.add("show");
      spawnSparkles();
    }, 900);

    setTimeout(() => {
      if (nextBtn) {
        nextBtn.style.display = "inline-block";
        nextBtn.classList.add("next-in");
      }
    }, 1600);
  });

  // Small sparkle burst near message (extra polish only)
  function spawnSparkles() {
    const layer = document.createElement("div");
    layer.className = "sparkle-layer";
    document.body.appendChild(layer);

    for (let i = 0; i < 18; i++) {
      const s = document.createElement("span");
      s.className = "sparkle";
      const angle = (Math.PI * 2 * i) / 18;
      const dist = 40 + Math.random() * 70;
      s.style.setProperty("--x", Math.cos(angle) * dist + "px");
      s.style.setProperty("--y", Math.sin(angle) * dist + "px");
      s.style.animationDelay = Math.random() * 0.25 + "s";
      layer.appendChild(s);
    }

    setTimeout(() => layer.remove(), 1600);
  }

  if (nextBtn) {
    nextBtn.addEventListener("click", () => {
      window.location.href = "password.html";
    });
  }
</script>

<!-- 🎵 Start Music on First Candle Tap -->
<script>
  const bgMusic = document.getElementById("bgMusic");
