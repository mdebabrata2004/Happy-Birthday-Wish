<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12141a" />
  <title>Soumi AI · For Soumi</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #12141a;
      --panel: rgba(28, 32, 42, 0.85);
      --accent: #a78bfa;
      --soft: #c4b5fd;
      --pink: #f0a8c0;
      --cream: #f4f2f7;
      --muted: #9ca3af;
      --bubble-me: rgba(99, 102, 241, 0.28);
      --bubble-ai: rgba(255, 255, 255, 0.07);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--cream);
      -webkit-tap-highlight-color: transparent;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .app {
      position: relative;
      z-index: 2;
      height: 100dvh;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-t);
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      gap: 8px;
      background: rgba(18, 20, 26, 0.75);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 1px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(167, 139, 250, 0.3);
      background: rgba(255, 255, 255, 0.05);
      color: var(--cream);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn.muted { opacity: 0.45; }

    .next-btn {
      appearance: none;
      border: 1px solid rgba(167, 139, 250, 0.4);
      background: rgba(99, 102, 241, 0.2);
      color: var(--cream);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.5rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }

    .next-btn:active { transform: scale(0.96); }

    /* Chat */
    .chat {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 82%;
      padding: 10px 13px;
      border-radius: 16px;
      line-height: 1.45;
      font-size: 0.95rem;
      animation: msg-in 0.3s ease both;
      word-break: break-word;
    }

    .msg.me {
      align-self: flex-end;
      background: var(--bubble-me);
      border-bottom-right-radius: 5px;
      border: 1px solid rgba(129, 140, 248, 0.25);
    }

    .msg.ai {
      align-self: flex-start;
      background: var(--bubble-ai);
      border-bottom-left-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 1.2rem;
      letter-spacing: 0.03em;
    }

    .msg.ai .label {
      display: block;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--soft);
      margin-bottom: 4px;
      font-family: Inter, sans-serif;
      opacity: 0.85;
    }

    .typing {
      align-self: flex-start;
      padding: 11px 14px;
      background: var(--bubble-ai);
      border-radius: 16px;
      border-bottom-left-radius: 5px;
      display: none;
      gap: 5px;
      align-items: center;
    }

    .typing.show { display: flex; }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .quick {
      display: flex;
      gap: 6px;
      padding: 4px 12px 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .quick::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      border: 1px solid rgba(167, 139, 250, 0.25);
      background: rgba(255, 255, 255, 0.05);
      color: var(--cream);
      font-size: 0.75rem;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip:active { background: rgba(99, 102, 241, 0.2); }

    /* Composer */
    .composer {
      padding: 8px 12px calc(10px + var(--safe-b));
      background: rgba(18, 20, 26, 0.9);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .composer-inner {
      display: flex;
      align-items: flex-end;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(167, 139, 250, 0.22);
      border-radius: 20px;
      padding: 5px 5px 5px 12px;
    }

    #input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--cream);
      font-size: 16px;
      font-family: inherit;
      resize: none;
      max-height: 90px;
      min-height: 22px;
      line-height: 1.4;
      outline: none;
      padding: 6px 0;
    }

    #input::placeholder { color: var(--muted); }

    #send {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #send:active { transform: scale(0.93); }

    /* Tap to unlock music overlay */
    .unlock {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(12, 14, 20, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      transition: opacity 0.45s ease, visibility 0.45s;
    }

    .unlock.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .unlock h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.5rem;
      font-weight: 500;
    }

    .unlock p {
      color: var(--muted);
      font-size: 0.9rem;
      max-width: 260px;
    }

    .unlock-btn {
      margin-top: 8px;
      border: 1px solid rgba(167, 139, 250, 0.45);
      background: rgba(99, 102, 241, 0.25);
      color: var(--cream);
      font-size: 0.85rem;
      padding: 12px 28px;
      border-radius: 999px;
      cursor: pointer;
    }
  </style>
</head>

    (function () {
      "use strict";

      // ── Background: mostly cool particles, ~30% soft hearts ──
      const canvas = document.getElementById("bg-canvas");
      const ctx = canvas.getContext("2d");
      let W, H, particles = [];

      function resize() {
        W = canvas.width = innerWidth;
        H = canvas.height = innerHeight;
      }
      resize();
      addEventListener("resize", resize, { passive: true });

      function makeP() {
        const heart = Math.random() < 0.28; // ~30% hearts
        return {
          x: Math.random() * W,
          y: Math.random() * H,
          r: 0.6 + Math.random() * 1.8,
          vx: (Math.random() - 0.5) * 0.2,
          vy: -0.12 - Math.random() * 0.25,
          a: 0.12 + Math.random() * 0.3,
          heart,
          size: 5 + Math.random() * 8
        };
      }

      for (let i = 0; i < 32; i++) particles.push(makeP());

      function drawHeart(x, y, s, a) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s / 16, s / 16);
        ctx.beginPath();
        ctx.moveTo(0, 3);
        ctx.bezierCurveTo(-9, -5, -12, 6, 0, 14);
        ctx.bezierCurveTo(12, 6, 9, -5, 0, 3);
        ctx.fillStyle = `rgba(240, 168, 192, ${a * 0.55})`;
        ctx.fill();
        ctx.restore();
      }

      function loop() {
        ctx.clearRect(0, 0, W, H);
        const g = ctx.createRadialGradient(W * 0.5, H * 0.2, 0, W * 0.5, H * 0.35, H * 0.65);
        g.addColorStop(0, "rgba(70, 60, 120, 0.2)");
        g.addColorStop(1, "rgba(18, 20, 26, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.y < -20) {
            p.y = H + 15;
            p.x = Math.random() * W;
          }
          if (p.heart) drawHeart(p.x, p.y, p.size, p.a);
          else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(180, 170, 255, ${p.a})`;
            ctx.fill();
          }
        }
        requestAnimationFrame(loop);
      }
      loop();

      // ── Audio ──
      const music = document.getElementById("bgMusic");
      const musicBtn = document.getElementById("musicBtn");
      let musicOn = false;

      async function startMusic() {
        try {
          music.volume = 0.82;
          await music.play();
          musicOn = true;
          musicBtn.classList.remove("muted");
          musicBtn.textContent = "♪";
        } catch (e) {
          musicOn = false;
          musicBtn.classList.add("muted");
        }
      }

      async function toggleMusic() {
        if (musicOn) {
          music.pause();
          musicOn = false;
          musicBtn.classList.add("muted");
          musicBtn.textContent = "🔇";
        } else {
          await startMusic();
        }
      }
      musicBtn.addEventListener("click", toggleMusic);

      // Unlock overlay → auto music
      const unlock = document.getElementById("unlock");
      document.getElementById("unlockBtn").addEventListener("click", async () => {
        unlock.classList.add("hide");
        await startMusic();

      function addMsg(text, who) {
        const div = document.createElement("div");
        div.className = "msg " + who;
        if (who === "ai") {
          div.innerHTML = '<span class="label">Emoji AI</span>' + text.replace(/\n/g, "<br>");
        } else {
          div.textContent = text;
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      function autoResize() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 90) + "px";
      }
      input.addEventListener("input", autoResize);

      function send(text) {
        const val = (text ?? input.value).trim();
        if (!val) return;

        addMsg(val, "me");
        input.value = "";
        autoResize();

        typing.classList.add("show");
        chat.appendChild(typing);
        chat.scrollTop = chat.scrollHeight;

        setTimeout(() => {
          typing.classList.remove("show");
          addMsg(emojiReply(val), "ai");
        }, 500 + Math.random() * 600);
      }

      sendBtn.addEventListener("click", () => send());
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      document.getElementById("quick").addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (chip) send(chip.getAttribute("data-text"));
      });
    })();
  </script>
</body>
</html>
