<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soumi Gallery</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope&display=swap" rel="stylesheet">

  <style>
   @import url('https://fonts.googleapis.com/css2?family=Manrope');

:root {
  font-size: clamp(1.5rem, 2vw + 1rem, 2.5rem);
  --clr-bg: #020617;
  --clr-text: #fff;
  --hover-intensity: 10rem;
  --hover-smoothness: 70ms; 
  --fall-smoothness: 250ms;
  --perspective: 2000px;
}

body {
  height: 100svh;
  display: grid;
  place-items: center;
  font-family: "Manrope", sans-serif;
  background: var(--clr-bg);
  color: var(--clr-text);
  overflow: hidden;
  padding: 2em;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

nav {  
  --p: 0;           
  --z: 1;           
  --r: calc(var(--max-z) * (var(--p) - 1) + var(--z)); 
  --r-n: calc((var(--r) - 1) / (var(--max-z) * var(--max-p) - 1));
  
  block-size: min(8rem, 100%);
  inline-size: min(30rem, 100%);
  display: flex;
  align-items: flex-end;
  position: relative;
  perspective: var(--perspective);
  transform-style: preserve-3d;
  --dir: 0deg;

  @media (max-width: 40rem) {
    writing-mode: sideways-rl;
    --dir: -90deg;
  }
}

a {  
  flex: 1;
  block-size: 100%;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  color: inherit;
  font-size: 1rem;
  cursor: pointer;
  transform-style: preserve-3d;
  
  --ts: calc(var(--hover-smoothness) * var(--falloff) + var(--fall-smoothness) * (1 - var(--falloff)));
  --fs: calc(.1s * var(--falloff,0) + .8s * (1 - var(--falloff,0)));
  
  transition: scale var(--op, .15s), filter var(--fs), transform var(--ts, var(--fall-smoothness)), flex .3s;
}

a {
  --p-n: calc(var(--i) / (var(--max-p) - 1));
  --diff: calc(var(--p-n) - var(--r-n));  
  --u: calc(abs(var(--diff)) / var(--w)); 
  --w: .4;
  --falloff: clamp(calc(0.5 * (1 + cos(min(var(--u), 1) * 180deg))), 0, 1);
  --tilt: calc(clamp(-1,var(--diff) * 5, 1) * var(--falloff) * 70deg);
  
  transform: 
    translateZ(calc(var(--falloff) * var(--hover-intensity)))
    rotateY(calc(var(--tilt) * cos(var(--dir))))
    rotateX(calc(var(--tilt) * sin(var(--dir))));
  
  filter: brightness(calc(0.7 + var(--falloff) * 0.5)) saturate(calc(0.8 + var(--falloff) * 0.4));
}

.img {
  background: var(--img);
  background-size: cover;
  background-position: center;
  width: 100%;
  height: 100%;
  margin-inline: 0.1em;
  border-radius: 0.5rem;
  box-shadow: 0 0 25px rgba(255,255,255,0.1);
}

.hover-zone {
  position: absolute;
  inset: 0;
  inset-inline: -3px;
  display: flex;
  z-index: 999;
}

.hover-zone > i {
  flex: 1;
  transition: .3s;
}

nav:has(.hover-zone:hover):not(:has(i:hover)), 
nav:has(a:focus-visible) {
  --z: calc((var(--max-z) + 1) / 2);
  a:hover, a:focus-visible {
    flex: 4;
  }
}

a.touch-hover {
  transform: scale(1.08) translateZ(var(--hover-intensity));
  filter: brightness(1.15) saturate(1.1);
  z-index: 5;
  transition: transform 0.25s ease, filter 0.25s ease;
}

#nextBtn {
  position: fixed;
  bottom: 30px; /* নিচ থেকে দূরত্ব */
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #0011ff, #e44dff);
  color: white;
  border: none;
  padding: 0.18rem 0.3rem; /* ছোট আকার */
  border-radius: 10px;
  font-size: 0.6rem;
  font-family: "Manrope", sans-serif;
  letter-spacing: 0.5px;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
  transition: all 0.3s ease;
  z-index: 9999;
}

#nextBtn:hover {
  transform: translateX(-50%) scale(1.07);
  box-shadow: 0 0 20px rgba(255, 100, 150, 0.9);
}



  </style>
</head>

<body>
  <!-- 🎵 Background Music -->
  <audio id="bgMusic" loop preload="auto">
    <source src="audio/song5.mpeg" type="audio/mpeg">
  </audio>
  <nav id="firebaseGallery"></nav>

  <!-- 🔹 Center Next Button -->
<button id="nextBtn">Next</button>


  <!-- Firebase JS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getStorage, ref, listAll, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";

   const firebaseConfig = {
  apiKey: "AIzaSyB5hvTyMGgNC5KBKEXLLvMOjo79PcbJePQ",
  authDomain: "soumihbd.firebaseapp.com",
  projectId: "soumihbd",
  storageBucket: "soumihbd.firebasestorage.app",
  messagingSenderId: "308697687570",
  appId: "1:308697687570:web:4d2b0144919bcfd4b95acb",
  measurementId: "G-2ZV3D7WBFZ"
};

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const galleryEl = document.getElementById('firebaseGallery');

    async function loadGallery() {
      try {
        const folderRef = ref(storage, 'soumi_gallery');
        const res = await listAll(folderRef);

        if (res.items.length === 0) {
          galleryEl.innerHTML = '<p style="color:#aaa;text-align:center;">Gallery খালি আছে — "soumi_gallery" ফোল্ডারে ছবি আপলোড করো।</p>';
          return;
        }

        let i = 1;
        galleryEl.style.setProperty("--max-p", res.items.length);
        galleryEl.style.setProperty("--max-z", 9);

        for (const itemRef of res.items) {
          const url = await getDownloadURL(itemRef);
          const a = document.createElement('a');
          a.style.setProperty("--i", i++);
          const img = document.createElement('div');
          img.className = 'img';
          img.style.backgroundImage = `url(${url})`;
          a.appendChild(img);
          galleryEl.appendChild(a);
        }

      } catch (err) {
        console.error(err);
        galleryEl.innerHTML = '<p style="color:#aaa;">Gallery লোড করতে সমস্যা হয়েছে। কনসোল চেক করো।</p>';
      }

      // Hover animation logic
galleryEl.addEventListener("mouseover", (e) => {
  const a = e.target.closest("a");
  if (a) {
    const index = a.style.getPropertyValue("--i");
    galleryEl.style.setProperty("--p", index);
  }
});

galleryEl.addEventListener("mouseout", (e) => {
  if (e.relatedTarget && galleryEl.contains(e.relatedTarget)) return;
  galleryEl.style.removeProperty("--p");
});
      
    }

    loadGallery();

   // 🔹 Fullscreen image viewer logic
const viewer = document.createElement("div");
viewer.id = "viewer";
viewer.style.cssText = `
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  cursor: zoom-out;
`;
const bigImg = document.createElement("img");
bigImg.style.cssText = `
  max-width: 90vw;
  max-height: 90vh;
  border-radius: 10px;
  box-shadow: 0 0 20px rgba(255,255,255,0.3);
  transition: transform 0.3s ease;
`;
viewer.appendChild(bigImg);
document.body.appendChild(viewer);

// Show full image on click/tap
galleryEl.addEventListener("click", (e) => {
  const imgDiv = e.target.closest(".img");
  if (!imgDiv) return;
  const bg = imgDiv.style.backgroundImage;
  const url = bg.slice(5, -2); // remove url("...")
  bigImg.src = url;
  viewer.style.display = "flex";
  document.body.style.overflow = "hidden";
});

// Hide on click anywhere
viewer.addEventListener("click", () => {
  viewer.style.display = "none";
  document.body.style.overflow = "";
});
  


let lastTapTime = 0;
let currentHover = null;
let currentImage = null;


// 🖐️ Touch or slide for hover effect
galleryEl.addEventListener("touchmove", (e) => {
  const touch = e.touches[0];
  const target = document.elementFromPoint(touch.clientX, touch.clientY);
  const a = target?.closest("a");
  if (!a) return;

  if (a !== currentHover) {
    currentHover?.classList.remove("touch-hover");
    a.classList.add("touch-hover");
    currentHover = a;

    const index = a.style.getPropertyValue("--i");
    galleryEl.style.setProperty("--p", index);
  }
});

// ✋ Touch end reset hover if finger leaves area
galleryEl.addEventListener("touchend", () => {
  setTimeout(() => {
    currentHover?.classList.remove("touch-hover");
    galleryEl.style.removeProperty("--p");
    currentHover = null;
  }, 400);
});

// 👆 Single vs Double tap logic (toggle fullscreen with animation)
galleryEl.addEventListener("touchstart", (e) => {
  const currentTime = new Date().getTime();
  const tapLength = currentTime - lastTapTime;
  lastTapTime = currentTime;

  const imgDiv = e.target.closest(".img");
  if (!imgDiv) return;

  // Double tap detection
  if (tapLength < 350 && tapLength > 50) {
    e.preventDefault();

    const bg = imgDiv.style.backgroundImage;
    const url = bg.slice(5, -2);

    // যদি একই image আবার double tap হয় → close fullscreen
    if (viewer.style.display === "flex" && currentImage === url) {
      viewer.style.opacity = "0";
      setTimeout(() => {
        viewer.style.display = "none";
        document.body.style.overflow = "auto";
      }, 300);
      return;
    }

    // না হলে নতুন image fullscreen এ দেখাও
    currentImage = url;
    bigImg.src = url;
    viewer.style.display = "flex";
    viewer.style.opacity = "0";
    document.body.style.overflow = "hidden";

    // smooth fade-in animation
    setTimeout(() => {
      viewer.style.transition = "opacity 0.3s ease";
      viewer.style.opacity = "1";
    }, 10);
  }
});

// 🔹 Next button click → go to wish.html
document.getElementById("nextBtn").addEventListener("click", () => {
  window.location.href = "wish.html";
});
 



  </script>
   <!-- 🛡️ Disable Right Click -->
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
  <script>
  const bgMusic = document.getElementById("bgMusic");
  const gallery = document.getElementById("firebaseGallery");

  gallery.addEventListener("click", async () => {
    try {
      bgMusic.volume = 1;
      await bgMusic.play();
    } catch (error) {
      console.log("Music play failed:", error);
    }
  });
</script>
</body>
</html>
