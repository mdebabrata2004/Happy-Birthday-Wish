<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Verification</title>

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(180deg, #ff00ea, hsl(291, 100%, 81%), #ff00ea);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* Container */
    .container {
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Card */
    .card {
      background: #ffebeb;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    /* Header */
    .header h1 {
      font-size: 24px;
      color: #ff0080;
      margin-bottom: 12px;
      font-weight: 800;
      
    }

    .header p {
      color: #009614;
      font-size: 12px;
    }

    /* Inputs */
    .input-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 25px 0;
    }

    .input-group input {
      width: 60px;
      height: 60px;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      border-radius: 10px;
      border: 2px solid #e5e7eb;
      background: #f3f4f6;
      outline: none;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: #6366f1;
      background: #fff;
      box-shadow: 0 0 6px rgba(99, 102, 241, 0.3);
    }

    /* Button */
    button {
      width: 100%;
      background: #ff009d;
      border: 1px solid #760031;
      color: #fff;
      padding: 12px 0;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    button:hover {
      background: #ad0450;
    }

    /* Hint */
    .hint {
      margin-top: 10px;
      font-size: 14px;
      color: #760031;
    }

    /* Toast Message */
#toast {
  visibility: hidden;
  min-width: 240px;
  background: #111827;
  color: #fff;
  text-align: center;
  border-radius: 10px;
  padding: 14px 18px;
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  z-index: 9999;
  font-weight: 500;
  opacity: 0;
  transition: all 0.4s ease;
}

#toast.show {
  visibility: visible;
  opacity: 1;
  bottom: 50px;
}

#toast.success {
  background: #16a34a; /* green */
}

#toast.error {
  background: #dc2626; /* red */
}
/* Responsive Toast for Mobile */
@media (max-width: 480px) {
  #toast {
    min-width: 180px;
    font-size: 14px;
    padding: 10px 14px;
    bottom: 20px;
  }

  #toast.show {
    bottom: 35px;
  }
}


    /* Responsive */
@media (max-width: 480px) {
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 0; /* remove extra padding */
  }

  .container {
    height: auto;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    padding: 25px 18px;
    max-width: 90%;
    margin: 0 auto;
    position: relative;
    top: 0;
    transform: none; /* remove unwanted shifting */
  }

  .input-group input {
    width: 45px;
    height: 45px;
    font-size: 18px;
  }

  .header h1 {
    font-size: 20px;
  }
}

  </style>
</head>

<body>
  <div class="container">
  <div class="card">

    <header class="header">
      <h1>🎉 HAPPY BIRTHDAY 🎉</h1>
      <p>Enter the 4-Digit Code to Unlock Your Surprise</p>
    </header>

    <form id="password-form">
      <div class="input-group">
        <input type="password" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="password" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="password" maxlength="1" inputmode="numeric" autocomplete="off" />
        <input type="password" maxlength="1" inputmode="numeric" autocomplete="off" />
      </div>

      <button type="submit">Unlock</button>
    </form>

    <p class="hint">
      💕 Soumi + Debabrata's Special Birthday Date
    </p>

  </div>
</div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("password-form");
    const inputs = [...form.querySelectorAll("input[type=password]")];
    const submit = form.querySelector("button");
    const correctPassword = "1626";

    // 🔹 Toast container তৈরি
    const toast = document.createElement("div");
    toast.id = "toast";
    document.body.appendChild(toast);

    // 🔹 Toast show function
    function showToast(message, type = "success") {
      toast.textContent = message;
      toast.className = `show ${type}`;
      setTimeout(() => {
        toast.className = toast.className.replace("show", "");
      }, 2500);
    }

    const handleKeyDown = (e) => {
      if (
        !/^[0-9]{1}$/.test(e.key) &&
        e.key !== "Backspace" &&
        e.key !== "Delete" &&
        e.key !== "Tab" &&
        !e.metaKey
      ) {
        e.preventDefault();
      }

      if (e.key === "Delete" || e.key === "Backspace") {
        const index = inputs.indexOf(e.target);
        if (index > 0) {
          inputs[index - 1].value = "";
          inputs[index - 1].focus();
        }
      }
    };

    const handleInput = (e) => {
      const { target } = e;
      const index = inputs.indexOf(target);
      if (target.value) {
        if (index < inputs.length - 1) {
          inputs[index + 1].focus();
        } else {
          submit.focus();
        }
      }
    };

    const handleFocus = (e) => e.target.select();

    const handlePaste = (e) => {
      e.preventDefault();
      const text = e.clipboardData.getData("text");
      if (!new RegExp(`^[0-9]{${inputs.length}}$`).test(text)) return;
      const digits = text.split("");
      inputs.forEach((input, index) => (input.value = digits[index]));
      submit.focus();
    };

    inputs.forEach((input) => {
      input.addEventListener("input", handleInput);
      input.addEventListener("keydown", handleKeyDown);
      input.addEventListener("focus", handleFocus);
      input.addEventListener("paste", handlePaste);
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const enteredPassword = inputs.map((i) => i.value).join("");

      if (enteredPassword === correctPassword) {
        showToast("🥰 Welcome, sweet Soumi! 💖 The surprise begins now... ✨🌙", "success");
        setTimeout(() => {
          window.location.href = "gallery.html";
        }, 1800);
      } else {
       showToast("❌ Wrong Madam ji 😆 Password wants a little love first... ❤️", "error");
        inputs.forEach((i) => (i.value = ""));
        inputs[0].focus();
      }
    });
  });
</script>

  
</body>
</html>
